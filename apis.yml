name: OnTopX402
description: >-
  A single money-ranked public link leaderboard where rank is decided by the amount paid in USDC via the x402 protocol.
  Submit a link, description, and amount to appear at the position that amount buys; bids stack. No accounts or API keys
  — reads are free, paid writes settle via x402 micropayments on Base and Solana.
