  note: >-
    Submitted via apis.io/add on 2026-08-24 and auto-published by the gate at rating 48. The
    submitted APIs.json URL returns 404 against a control that also 404s, so it is a bad pointer
    in the submission rather than an absent surface. Everything here was found from the provider's
    own llms.txt and OpenAPI.
    The x402 surface is real and was exercised. POST /api/bid with no payment header returns HTTP
    402 carrying x402Version 2, a `payment-required` header, and two `accepts` entries: USDC on
    Base (eip155:8453) and on Solana, both at amount 1000000 (a $1 minimum), 300-second timeout.
    The challenge also carries a `bazaar` extension with full JSON Schema for the request body and
    an example response — an unusually complete machine-readable purchase contract. The saved
    file under finops/ is that response verbatim. GET /api/leaderboard returns the live board
    unauthenticated and is saved under examples/.
    WHAT THIS SERVICE IS, STATED PLAINLY, BECAUSE IT BEARS ON WHETHER WE SHOULD CARRY IT. This is
    paid placement. The provider says so itself: "Rank is decided by the amount paid, and nothing
    else… There is no editorial judgement, no quality score, no review… This is paid placement,
    and it says so plainly. Listing links are followed." Its own tags include backlink, seo,
    sponsored and paid-placement. It is honest, working, and technically excellent — and it is
    also a followed-backlink product, which is the category API Evangelist refuses when it arrives
    by email. Listed here on the standing rule that a valid company with a real API gets listed
    and the rating speaks; flagged for a policy decision rather than decided unilaterally.
